name: Release

# Create a release by pushing a tag: git tag v1.2.0 && git push origin v1.2.0
# The tag is the version; it is passed to the build, so the About window shows it.
on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Version from tag
      id: version
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        "version=$version" >> $env:GITHUB_OUTPUT

    - name: Restore
      run: dotnet restore Siniskalc.sln

    - name: Test
      run: dotnet test Siniskalc.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

    - name: Publish
      run: dotnet publish Siniskalc/Siniskalc.csproj -c Release -r win-x64 --self-contained false -p:Version=${{ steps.version.outputs.version }} -o publish

    - name: Zip
      shell: pwsh
      run: Compress-Archive -Path publish/* -DestinationPath "Siniskalc-${{ steps.version.outputs.version }}-win-x64.zip"

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        files: Siniskalc-${{ steps.version.outputs.version }}-win-x64.zip
        generate_release_notes: true
        prerelease: ${{ contains(steps.version.outputs.version, '-') }}
